[workspace]
members = [
	"makarincord_admin",
	"makarincord_app_proxy",
	"makarincord_common",
	"makarincord_media_proxy",
	"makarincord_gifs",
	"makarincord_svc",
	"makarincord_messages",
	"makarincord_push",
	"makarincord_snowflakes",
	"tools/ci",
	"tools/dev",
	"tools/i18n_auto",
	"makarincord_users",
	"makarincord_unfurl",
	"packages/markdown_parser/rust",
]
exclude = [
	"packages/markdown_parser/rust/fuzz",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
